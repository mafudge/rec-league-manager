# Render Blueprint for the live API (REL-01d, ADR 006, docs/deploy.md).
# One service that builds from main, so it always runs the newest release.
# The name keeps its v0-2-1 suffix on purpose: renaming would create a new service at a new URL.
services:
  - type: web
    name: rlm-api-v0-2-1
    runtime: python
    plan: free
    branch: main
    rootDir: src/backends/fastapi
    buildCommand: pip install -r requirements.txt
    # The free disk is wiped on every sleep and deploy, so every start seeds a fresh SQLite file.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEMO_SEED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Needed to create an account (US13-02); unset means sign-up is closed. Typed into Render, never committed.
      - key: SIGNUP_PASSWORD
        sync: false
